<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elva's Sweet 17 – Undangan</title>
<link href="https://fonts.googleapis.com/css2?family=Playball&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--pink:#e58ab5;--soft:#f6b6d2;--blush:#ffeaf1;--ink:#b8578a;--card:#fff;--panel:#fff;--txt:#3b2a33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2a1d24;--txt:#f5dfe8}}
:root[data-theme="dark"]{--panel:#2a1d24;--txt:#f5dfe8}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:'Outfit',system-ui,sans-serif;color:var(--pink);background:repeating-linear-gradient(90deg,var(--soft) 0 34px,var(--blush) 34px 84px);overflow-x:hidden}
.script{font-family:'Playball','Brush Script MT',cursive}
/* cover */
#cover{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:repeating-linear-gradient(90deg,var(--soft) 0 34px,var(--blush) 34px 84px);text-align:center;transition:transform .9s ease,opacity .9s ease;padding:24px}
#cover.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
.env{width:min(260px,70vw);aspect-ratio:1.4;background:#f4a9c9;border-radius:6px;position:relative;box-shadow:0 10px 24px #b8578a55;cursor:pointer;border:0}
.env::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,50% 58%,100% 0);background:#ec92b9;border-radius:6px}
.env::after{content:"♡";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;color:var(--pink);display:grid;place-items:center;font-size:22px}
#cover h2{font-size:clamp(34px,10vw,52px);margin:8px 0 0;font-weight:400}
#cover p{margin:0;font-size:15px;color:var(--ink)}
/* card */
main{max-width:520px;margin:0 auto;padding:36px 16px 90px}
.card{background:var(--card);border-radius:46% 46% 40% 40% / 14% 14% 6% 6%;padding:64px 28px 52px;text-align:right;position:relative;box-shadow:0 0 0 10px #ffffffaa,0 0 0 14px #ffffff66;border:0}
.card::before{content:"✦";position:absolute;left:34px;top:34px;font-size:46px;color:#f6c8db;transform:rotate(-18deg)}
.lead{font-size:clamp(20px,5.4vw,26px);line-height:1.3;margin:36px 0 10px;font-weight:300}
.name{font-size:clamp(54px,17vw,84px);line-height:.95;margin:0;font-weight:400;letter-spacing:-.5px}
.name small{display:block;font-size:1em}
.when{margin-top:34px;font-size:clamp(17px,4.6vw,21px);line-height:1.5}
.btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
.btn{font:500 15px 'Outfit',sans-serif;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:12px 20px;text-decoration:none;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--soft)}
.btn:focus-visible,.fab:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.dress{margin-top:14px;font-size:clamp(16px,4.2vw,19px)}
.dots{display:inline-flex;gap:4px;vertical-align:middle;margin-left:8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pink);background:#222}.dots i+i{background:#fff}
.card2{background:var(--card);border-radius:28px;padding:26px 22px;margin-top:26px;text-align:left;box-shadow:0 0 0 8px #ffffff88}
.card2 h2{margin:0 0 6px;font-size:34px;font-weight:400;text-align:center}
.card2 label{display:block;font-size:14px;margin:12px 0 4px;color:var(--ink)}
.card2 input[type=text],.card2 input[type=number]{width:100%;font:16px 'Outfit',sans-serif;padding:11px 12px;border:2px solid var(--soft);border-radius:12px;background:#fff;color:#3b2a33}
.choice{display:flex;gap:10px;margin-top:6px}.choice label{flex:1;margin:0;border:2px solid var(--soft);border-radius:12px;padding:11px;text-align:center;cursor:pointer;color:var(--ink);font-size:15px}
.choice label:has(input:checked){background:var(--pink);border-color:var(--pink);color:#fff}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label:has(input:focus-visible){outline:3px solid var(--ink);outline-offset:2px}
#rMsg{width:100%;margin-top:10px;font:15px 'Outfit',sans-serif;padding:10px 12px;border:2px solid var(--soft);border-radius:12px;background:#fff;color:#3b2a33;resize:none}
#rNote{margin:10px 0 0;font-size:14px;color:var(--ink)}
#rSend{width:100%;margin-top:16px}
#recapOut{margin-top:8px;font-size:14px;font-weight:500}
.count{display:flex;gap:8px;justify-content:flex-end;margin-top:28px}
.count div{background:var(--blush);border-radius:14px;padding:10px 0;width:64px;text-align:center;color:var(--ink);font-size:12px}
.count b{display:block;font-size:24px;font-weight:500;color:var(--pink)}
.msg{margin-top:28px;font-size:16px}
/* floating */
.fab{position:fixed;right:14px;z-index:10;width:46px;height:46px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 14px #b8578a66}
#musicBtn{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#musicBtn.on{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* panel */
#panel{position:fixed;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:var(--panel);color:var(--txt);z-index:30;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s;box-shadow:0 -8px 30px #0004}
#panel.open{transform:none}
#panel h3{margin:0 0 12px;font-size:18px}
#panel label{display:block;font-size:13px;margin:10px 0 4px}
#panel input,#panel textarea{width:100%;font:16px 'Outfit',sans-serif;padding:10px 12px;border:2px solid var(--soft);border-radius:12px;background:transparent;color:inherit}
#panel .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#panel .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
#panel small{display:block;margin-top:6px;opacity:.75;font-size:12px}
@media (prefers-reduced-motion:reduce){#musicBtn.on{animation:none}#cover,#panel{transition:none}}
</style>
</head>
<body>
<section id="cover">
  <p>Ada surat kecil untukmu ♡</p>
  <button class="env" id="openBtn" aria-label="Buka undangan"></button>
  <h2 class="script" id="cvName">Elva's Sweet 17</h2>
  <p>Ketuk amplopnya, ada kabar seru di dalam</p>
</section>

<main>
  <div class="card">
    <p class="lead" id="tLead">Ada bab baru yang mau dirayakan,<br>dan kamu masuk daftar tamunya.<br>Datang ya ke</p>
    <h1 class="name script"><small id="tName">Elva's</small><small id="tAge">Sweet 17</small></h1>
    <p class="when" id="tWhen"></p>
    <p class="dress" id="tDress"></p>
    <div class="count" id="count" aria-label="Hitung mundur"></div>
    <p class="msg" id="tMsg">Sampai ketemu di sana ♡</p>
    <div class="btns">
      <a class="btn alt" id="mapLink" target="_blank" rel="noopener">Tempat acara</a>
      <a class="btn" id="rsvpLink" href="#rsvp">Kabari kehadiranmu</a>
    </div>
  </div>
  <section class="card2" id="rsvp">
    <h2 class="script">Kamu datang, kan?</h2>
    <label for="rName">Namamu</label><input type="text" id="rName" autocomplete="name">
    <div class="choice" role="radiogroup" aria-label="Kehadiran">
      <label><input type="radio" name="att" value="Hadir" checked>Aku datang!</label>
      <label><input type="radio" name="att" value="Tidak hadir">Belum bisa</label>
    </div>
    <div id="cntWrap"><label for="rCount">Berapa orang yang datang? (termasuk kamu)</label><input type="number" id="rCount" min="1" max="10" value="1"></div>
    <button class="btn" id="rSend">Kirim kabar lewat WhatsApp</button>
    <p id="rNote" role="status"></p>
    <div id="rOut" hidden>
      <textarea id="rMsg" rows="4" readonly aria-label="Pesan RSVP"></textarea>
      <div class="btns" style="justify-content:flex-start"><a class="btn" id="rGo" target="_blank" rel="noopener">Buka WhatsApp</a><button class="btn alt" id="rCopy" type="button">Salin pesan</button></div>
    </div>
  </section>
</main>

<button class="fab" id="musicBtn" aria-label="Putar musik">♪</button>


<audio id="audio" loop preload="auto"></audio>
<script>
(function(){
var DEF={lead:"Hi, you're invited to",name:"Elva's",age:"Sweet 17",date:"2026-10-03",time:"19:00",dress:"hitam putih",place:"Jl. Pancawarga V Gg. 14 No. 26",msg:"Sampai ketemu di sana ♡",wa:"6287765758474"};
var D=Object.assign({},DEF);
var $=function(i){return document.getElementById(i)};
function esc(t){return String(t).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
var BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
function render(){
  $('tLead').innerHTML=esc(D.lead).replace(/\n/g,'<br>');
  $('tName').textContent=D.name;$('tAge').textContent=D.age;
  $('cvName').textContent=D.name+" "+D.age;
  var p=D.date.split('-'),ds=p.length==3?parseInt(p[2],10)+" "+BLN[+p[1]-1]+" "+p[0]:"";
  $('tWhen').innerHTML=esc(ds+(D.time?" | "+D.time.replace(":",".")+" WIB":""))+"<br>"+esc(D.place);
  $('tMsg').textContent=D.msg;
  var dd=$('tDress');dd.textContent="Dress code: "+D.dress;
  if(/hitam/i.test(D.dress)&&/putih/i.test(D.dress)){dd.insertAdjacentHTML('beforeend','<span class="dots" aria-hidden="true"><i></i><i></i></span>')}
  dd.style.display=D.dress?"":"none";
  $('mapLink').href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(D.place);
  document.title=D.name+" "+D.age+" – Undangan";
  tick();
}
function tick(){
  var t=new Date(D.date+"T"+(D.time||"00:00")+":00")-new Date(),c=$('count');
  if(isNaN(t)){c.innerHTML="";return}
  if(t<0){c.innerHTML="<div><b>♡</b>Hari-H!</div>";return}
  var v=[[Math.floor(t/864e5),"hari"],[Math.floor(t/36e5)%24,"jam"],[Math.floor(t/6e4)%60,"menit"],[Math.floor(t/1e3)%60,"detik"]];
  c.innerHTML=v.map(function(x){return"<div><b>"+x[0]+"</b>"+x[1]+"</div>"}).join("");
}
setInterval(tick,1000);render();

/* rsvp */
function attVal(){return document.querySelector('input[name=att]:checked').value}
document.querySelectorAll('input[name=att]').forEach(function(r){r.onchange=function(){$('cntWrap').style.display=attVal()=="Hadir"?"":"none"}});
$('rsvpLink').onclick=function(e){e.preventDefault();$('rsvp').scrollIntoView({behavior:'smooth'})};
$('rSend').onclick=function(){
  var n=$('rName').value.trim(),wa=(D.wa||"").replace(/\D/g,''),note=$('rNote');
  if(!n){note.textContent="Isi namamu dulu ya.";$('rName').focus();return}
  if(!wa){note.textContent="Nomor WhatsApp tuan rumah belum diisi.";return}
  var h=attVal()=="Hadir",c=Math.max(1,Math.min(10,parseInt($('rCount').value,10)||1));
  var m="RSVP "+D.name+" "+D.age+"\nNama: "+n+"\nKehadiran: "+attVal()+(h?"\nJumlah: "+c+" orang":"");
  $('rMsg').value=m;
  $('rGo').href="https://wa.me/"+wa+"?text="+encodeURIComponent(m);
  $('rOut').hidden=false;
  note.textContent="Tekan \u201cBuka WhatsApp\u201d. Kalau tidak terbuka, salin pesan di bawah lalu kirim manual ke +"+wa+".";
};
$('rCopy').onclick=function(){
  var t=$('rMsg');t.select();
  try{if(navigator.clipboard)navigator.clipboard.writeText(t.value)}catch(e){}
  try{document.execCommand('copy')}catch(e){}
  $('rNote').textContent="Pesan disalin. Tempel dan kirim ke WhatsApp tuan rumah ya.";
};

/* music */
var SONG="music/lagu.mp3"; /* ganti dengan nama file lagu di folder music/ */
var a=$('audio'),mb=$('musicBtn'),playing=false,useFile=false,ctx=null,timer=null,stopFlag=true,repoSong=true;
a.src=SONG;useFile=true;
/* jika file lagu tidak ada / gagal dimuat, pakai melodi bawaan */
a.addEventListener('error',function(){
  if(!repoSong)return;
  repoSong=false;useFile=false;a.removeAttribute('src');
  if(playing){playing=false;start();}
});
var N={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
var MEL=[["G4",.75],["G4",.25],["A4",1],["G4",1],["C5",1],["B4",2],["G4",.75],["G4",.25],["A4",1],["G4",1],["D5",1],["C5",2],["G4",.75],["G4",.25],["G5",1],["E5",1],["C5",1],["B4",1],["A4",1],["F5",.75],["F5",.25],["E5",1],["C5",1],["D5",1],["C5",2]];
function note(f,t,d){
  var o=ctx.createOscillator(),g=ctx.createGain();
  o.type="triangle";o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d*1.6);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d*1.7);
}
function loop(){
  if(stopFlag)return;
  var t=ctx.currentTime+.1,b=.55;
  MEL.forEach(function(n){note(N[n[0]],t,n[1]*b);t+=n[1]*b});
  timer=setTimeout(loop,(t-ctx.currentTime+1.5)*1000);
}
function start(){
  if(useFile){a.play().catch(function(){});}
  else{
    try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();stopFlag=false;loop();}catch(e){}
  }
  playing=true;mb.classList.add('on');
}
function stop(){a.pause();stopFlag=true;clearTimeout(timer);playing=false;mb.classList.remove('on')}
mb.onclick=function(){playing?stop():start()};
$('openBtn').onclick=function(){$('cover').classList.add('gone');if(!playing)start()};
})();
</script>
</body>
</html>
